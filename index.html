
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Pertamaku</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            color: #222;
        }

        nav {
            background: #173b79;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #173b79;
            font-size: 42px;
        }

        p {
            line-height: 1.8;
        }

        button {
            background: #173b79;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 22px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 15px;
            background: #e2e8f0;
        }
    </style>
</head>

<body>
    <nav>
        <strong>WEBSITE SAYA</strong>
    </nav>

    <main>
        <h1>Selamat Datang!</h1>
        <p>
            Halo, ini adalah website pertama saya.
            Website ini dibuat menggunakan HTML dan CSS.
        </p>

        <button onclick="alert('Website berhasil dibuat!')">
            Klik Saya
        </button>
    </main>

    <footer>
        Website Saya &copy; 2026
    </footer>
</body>
</html>
